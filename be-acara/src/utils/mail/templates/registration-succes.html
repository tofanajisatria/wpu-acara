<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Selamat Datang!</h1>
        </div>
        <div class="content">
            <p>Halo <%= username %>, </p>
            <p>
                Terima kasih telah mendaftar dilayanan kami. Berikut adalah informasi dari akun Anda:
            </p>
            <ul>
                <li><strong>Nama:</strong><%= fullName %></li>
                <li><strong>Email:</strong><%= email %></li>
                <li><strong>Tanggal Pendaftaran:</strong><%= createdAt %></li>
            </ul>
        </div>
    </div>
</body>
</html>
